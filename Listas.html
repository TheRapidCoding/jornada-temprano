<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas en html</title>
    <meta name="description" content="aqui trabajaremos los diferentes tipos de listas en html">
    <meta name="keywords" content="html, listas html,">
</head>
<body>
    <h1>LISTAS EN HTML</h1>
    <h2>Listas ordenadas</h2>
    <label>Deportes</label>
    <ol start="5" type="a">
        <li>Futbol</li>
        <li>Natacion</li>
        <li>Baloncesto</li>
    </ol>
    <h2>Listas NO ordenadas</h2>
    <label>Tipos de soldaduras</label>
    <ul type="circle">
        <li>SMAW</li>
        <li>GMAW</li>
        <li>TGAW</li>
        <li>SAW</li>
        <li>FCAW</li>
    </ul>
    <h2>LIstas de definicion</h2>
    <label>Habilidades</label>
    <dl>
        <dt>Musica</dt>
        <dd>Soy bueno en hacer musica</dd>
        <dt>cocinar</dt>
        <dd>soy bueno en hacer arroz</dd>
    </dl>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas en HTML</title>
    <meta name="description" content="como hacer tablas en HTML">
    <meta name="keywords" content="html, tablas, ">
</head>
<body>
    <h1>TABLAS EN HTML</h1>
    <h2>TABLA BASICA DE 3 FILAS Y 2 COLUMNAS</h2>
    <table border="1">
        <tr>
            <td>f1-c1</td>
            <td>f1-c2</td>
        </tr>
        <tr>
            <td>f2-c1</td>
            <td>f2-c2</td>           
        </tr>
        <tr>
            <td>f3-c1</td>
            <td>f3-c2</td>
        </tr>
    </table>
    <h2>Tabla completa de 3 Filas por 2 columnas</h2>
    <table border="5px"  cellpadding="25px"       
     <thead>
            <tr>
                <th>identificacion</th>
                <th>Nombres y Apellidos</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1019993219</td>
                <td>Harold Antonio</td>
            </tr>
            <tr>
                <td>3128712327</td>
                <td>Olga Patricia</td>
            </tr>
            <tr>
                <td>3209545347</td>
                <td>Vallolet Adhara</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
